{% extends "base.html" %}
<h1>{% block title %}Podaj Definicje{% endblock %}</h1>
{% block content %}
<h1>Podaj definicje</h1>
<form action="" method="post" novalidate>
    {{ form.hidden_tag() }}
    <p>
        {{form.crosswordPassword.label}}<br>
        {{form.crosswordPassword(size=32)}}
    </p>
    <p>
        {{form.submit()}}
    </p>
</form>
{% endblock %}
